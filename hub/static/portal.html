<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e3a6e"><title>Portal · {{NOME}}</title>
<link rel="stylesheet" href="/hub-static/hub.css"><link rel="icon" href="/hub-static/icone.svg"></head>
<body>
<header class="topo"><div class="topo-in">
  <div><div class="marca" id="marca"></div><div class="sub" id="subtitulo"></div></div>
  <div class="acoes">
    <span class="resumo" id="resumo"></span>
    <span class="quem" id="quem"></span>
    <button class="btn so-admin" id="bAdmin" title="Admin técnico: ferramentas, ecossistema, usuários, organização, backup">⚙ <span class="rotulo">Admin técnico</span></button>
    <button class="btn primario so-admin" id="bPlugar" title="Plugar um app (.zip)">＋ <span class="rotulo">Plugar app</span></button>
    <button class="btn so-admin" id="bRecarregar" title="Procurar apps novos na pasta">⟳</button>
    <a class="btn" id="bNotif" href="/notificacoes#ver" title="Notificações de todas as ferramentas e preferências">🔔 <span class="rotulo">Notificações</span> <span id="nNotif"></span></a>
    <button class="btn" id="bSair" title="Sair">Sair</button>
  </div>
</div></header>
<main>
  <div class="barra-ferr">
    <div class="busca"><input class="campo" id="busca" placeholder="Buscar ferramenta…" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grade" id="grade"></div>
  <div class="vazio" id="vazio" hidden>
    <div style="font-size:34px;margin-bottom:10px">🧩</div>
    <p style="font-weight:600;color:var(--text);margin-bottom:6px">Nenhuma ferramenta plugada ainda</p>
    <p>Copie uma pasta com um <code>hub.json</code> para <code id="pastaApps">apps/</code> ou use <b>＋ Plugar app</b>.</p>
  </div>
  <div class="rodape" id="rodape"></div>
</main>
<script src="/hub-static/marca.js"></script>
<script src="/hub-static/portal.js"></script>
<script>fetch('/api/hub/notificacoes').then(r => r.ok ? r.json() : null).then(d => { if (d && d.pendentes) document.getElementById('nNotif').textContent = '(' + d.pendentes + ')' }).catch(() => {})</script>
</body></html>
