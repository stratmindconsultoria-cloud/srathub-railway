<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Originação de Projetos</title>
<style>
:root{
  --paper:#FBFAFD; --surface:#FFFFFF; --surface-2:#F7F3FB; --ink:#241A2E; --muted:#6C6175; --line:#E5DDED;
  --petrol:#6B2C91; --petrol-deep:#4B1D69; --petrol-soft:#EEE4F5; --side-ink:#FFFFFF; --side-muted:#D9C8E6;
  --signal:#C98A00; --signal-soft:#FBEFD2;
  --ok:#2A7647; --ok-soft:#DCEFE3; --bad:#AE3832; --bad-soft:#F6E0DE; --neutral-soft:#E6ECEB;
  --radius-s:4px; --radius-m:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#FBFAFD; --surface:#FFFFFF; --surface-2:#F7F3FB; --ink:#241A2E; --muted:#6C6175; --line:#E5DDED;
    --petrol:#6B2C91; --petrol-deep:#4B1D69; --petrol-soft:#EEE4F5; --side-ink:#FFFFFF; --side-muted:#D9C8E6;
    --signal:#EDB23C; --signal-soft:#3A2F12; --ok:#62BE88; --ok-soft:#173524; --bad:#E3766F; --bad-soft:#3E1D1B; --neutral-soft:#223639;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#FBFAFD; --surface:#FFFFFF; --surface-2:#F7F3FB; --ink:#241A2E; --muted:#6C6175; --line:#E5DDED;
  --petrol:#6B2C91; --petrol-deep:#4B1D69; --petrol-soft:#EEE4F5; --side-ink:#FFFFFF; --side-muted:#D9C8E6;
  --signal:#EDB23C; --signal-soft:#3A2F12; --ok:#62BE88; --ok-soft:#173524; --bad:#E3766F; --bad-soft:#3E1D1B; --neutral-soft:#223639;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--petrol)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--petrol-deep);color:var(--side-ink);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{font-stretch:75%;font-weight:750;font-size:22px;line-height:1.05;letter-spacing:-.01em}
.brand small{display:block;font-stretch:100%;font-weight:400;font-size:12.5px;color:var(--side-muted);margin-top:6px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:2px}
nav a{color:var(--side-ink);text-decoration:none;padding:8px 10px;border-radius:var(--radius-s);display:flex;justify-content:space-between;align-items:center}
nav a:hover{background:rgba(255,255,255,.06)}
nav a[aria-current="page"]{background:rgba(255,255,255,.12);font-weight:600}
.count{background:var(--signal);color:#1d1600;border-radius:10px;font-size:12px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
.who{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;font-size:13px}
.who label{color:var(--side-muted);display:block;margin-bottom:6px}
.who select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--side-ink);border-radius:var(--radius-s);padding:7px}
.who select option{color:#17272C}
.who p{margin:8px 0 0;color:var(--side-muted);font-size:12px}
.mode{font-size:12px;color:var(--side-muted)}
.sync{margin-top:10px;padding:7px 9px;border-radius:8px;font-size:12px;display:flex;gap:6px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.08)}
.sync.bad{background:rgba(220,38,38,.25)}
.sync button{font:inherit;font-size:11.5px;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:6px;padding:2px 7px;cursor:pointer}
details.conting{margin-top:14px;border:1px dashed #d0d5dd;border-radius:10px;padding:10px 14px}
details.conting summary{cursor:pointer;color:#667085;font-size:13px}
.mode b{color:var(--side-ink);font-weight:600}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
h1{font-stretch:80%;font-weight:750;font-size:34px;line-height:1.05;margin:0 0 6px;letter-spacing:-.015em}
h2{font-stretch:85%;font-weight:700;font-size:20px;margin:0 0 12px}
h3{font-weight:650;font-size:15px;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 24px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:7px 14px;cursor:pointer;font-weight:550}
.btn:hover{border-color:var(--petrol)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#062224}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#062224}}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:3px 10px;font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
select,input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:74px;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 20px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:13px;color:var(--muted);font-weight:550}
.field input,.field select,.field textarea{width:100%}
.readonly{padding:7px 0;white-space:pre-wrap;min-height:36px;border-bottom:1px dashed var(--line)}
.readonly.empty{color:var(--muted)}

/* Linha de maturidade */
.line-wrap{overflow-x:auto;padding:6px 0 2px}
.mline{position:relative;display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));min-width:640px}
.mline::before{content:"";position:absolute;left:10%;right:10%;top:62px;height:6px;background:var(--petrol);border-radius:3px}
.station{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.station .sname{font-stretch:80%;font-weight:700;font-size:17px;height:28px}
.station .gate{font-size:11.5px;color:var(--muted);height:16px}
.dotbox{height:52px;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.dot{border-radius:50%;background:var(--surface);border:5px solid var(--petrol);position:relative;z-index:1}
.dot.term{box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--petrol)}
.station .num{font-stretch:75%;font-weight:760;font-size:30px;line-height:1;margin-top:8px}
.station .cap{font-size:13px;color:var(--muted)}
.station .pend{font-size:12px;margin-top:4px;color:var(--signal);font-weight:600;min-height:18px}
.station a{color:inherit;text-decoration:none}
.station a:hover .sname{text-decoration:underline}

.pline{display:grid;grid-template-columns:repeat(7,1fr);position:relative;margin:4px 0 8px}
.pline::before{content:"";position:absolute;left:10%;right:10%;top:13px;height:4px;background:var(--line)}
.pline .pfill{position:absolute;left:10%;top:13px;height:4px;background:var(--petrol)}
.pst{display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;font-size:11.5px;text-align:center}
.pdot{width:30px;height:30px;border-radius:50%;border:4px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pst.done .pdot{border-color:var(--petrol);background:var(--petrol);color:#fff}
.pst.cur .pdot{border-color:var(--petrol)}
.pst.wait .pdot{border-color:var(--signal);background:var(--signal-soft)}
.pst.back .pdot{border-color:var(--bad);background:var(--bad-soft)}
.pst b{margin-top:4px;font-weight:650}
.pst small{color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface)}
.kpis.dual{border:0;background:transparent;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpis.dual .kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--petrol);border-radius:10px;box-shadow:0 3px 12px rgba(75,29,105,.06)}
.project-layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:22px;align-items:start}
.project-side{position:sticky;top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.project-side a{display:block;padding:10px 12px;text-decoration:none;color:var(--ink);border-radius:7px}
.project-side a:hover{background:var(--surface-2)}
.project-side a[aria-current="page"]{background:var(--petrol-soft);color:var(--petrol);font-weight:700}
.pst a{display:flex;flex-direction:column;align-items:center;color:inherit;text-decoration:none;width:100%}
.pst a:hover b{color:var(--petrol)}
.pst.locked{opacity:.45}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.summary-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--petrol);border-radius:10px;padding:14px}
.summary-card .sv{font-size:24px;font-weight:750;margin-top:4px}
.eap-grid{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:16px;align-items:end}
.activity-table input,.activity-table select{width:100%;min-width:110px}
.activity-table td{vertical-align:middle}
.activity-table .money{min-width:150px}
.annual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.annual-cell{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px}
.annual-cell b{display:block;font-size:16px;margin-top:3px}
.next-action{border-left:4px solid var(--petrol);background:var(--petrol-soft)}
@media(max-width:850px){.project-layout{grid-template-columns:1fr}.project-side{position:static;display:flex;overflow-x:auto}.project-side a{white-space:nowrap}.eap-grid{grid-template-columns:1fr}}
.kpi{padding:14px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font-stretch:75%;font-weight:760;font-size:28px;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.countdown{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:0 0 22px;color:var(--muted)}
.countdown b{color:var(--ink);font-weight:650}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:130px 1fr 96px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:12px;background:var(--neutral-soft);border-radius:2px;overflow:hidden}
.bar .fillb{height:100%;background:var(--petrol)}
.bar .val{text-align:right;color:var(--muted)}
.stackbar{display:flex;height:16px;border-radius:2px;overflow:hidden;margin:6px 0 12px;background:var(--neutral-soft)}
.legend{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;font-size:13.5px;align-items:center}
.sw{width:11px;height:11px;border-radius:2px}
.c-eleg{background:var(--ok)} .c-mat{background:var(--petrol)} .c-risk{background:var(--signal)} .c-no{background:var(--bad)}

.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-eleg{background:var(--ok-soft);color:var(--ok)}
.b-mat{background:var(--petrol-soft);color:var(--petrol)}
.b-risk{background:var(--signal-soft);color:var(--signal)}
.b-no{background:var(--bad-soft);color:var(--bad)}
.b-neutral{background:var(--neutral-soft);color:var(--muted)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;white-space:nowrap}
.pid{font-size:12px;color:var(--muted)}
.pname{font-weight:600}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:550}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--petrol)}
.tabs a .mini{font-size:11px;margin-left:5px}
.head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.meta{color:var(--muted);font-size:13.5px}
.back{font-size:13.5px;text-decoration:none;display:inline-block;margin-bottom:10px}
.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.capgrid label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.capgrid input{width:100%;text-align:right}
.capgrid .ro{border-bottom:1px dashed var(--line);padding:6px 2px;text-align:right;color:var(--ink);font-size:14px}
.gatecard{display:grid;grid-template-columns:150px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.gatecard:last-child{border-bottom:0}
.gatecard .gname{font-stretch:80%;font-weight:720;font-size:18px}
.note{background:var(--signal-soft);border-left:3px solid var(--signal);padding:10px 14px;border-radius:0 var(--radius-s) var(--radius-s) 0;font-size:14px;margin:0 0 16px}
.note.info{background:var(--petrol-soft);border-color:var(--petrol)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.missing{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--bad)}
.empty-state{padding:40px 24px;text-align:center}
.empty-state p{color:var(--muted);max-width:56ch;margin:6px auto 16px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--radius-s);font-size:14px;max-width:420px;z-index:50;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;pointer-events:none}
.toast.show{opacity:1;transform:none}
dialog{border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);color:var(--ink);padding:22px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(8,20,22,.45)}
.refresh{position:sticky;top:0;z-index:5}
.hist td{font-size:13px}
.hist .de{color:var(--muted);text-decoration:line-through}
.muted{color:var(--muted)}
.list-plain{list-style:none;padding:0;margin:0}
.list-plain li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.list-plain li:last-child{border-bottom:0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:14px}
  nav{flex-direction:row;overflow-x:auto;width:100%}
  .who{margin-top:0;border-top:0;padding-top:0;width:100%}
  .gatecard{grid-template-columns:1fr}
  .bar{grid-template-columns:100px 1fr 80px}
  h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Originação de Projetos<small id="brandSub">PMO</small></div>
    <nav id="nav"></nav>
    <div class="who">
      <label for="userSel">Entrando como</label>
      <select id="userSel"></select>
      <p id="userInfo"></p>
      <p class="mode" id="modeInfo"></p>
      <div id="syncBox" class="sync" hidden></div>
    </div>
  </aside>
  <main id="main"><p class="muted">Conectando à base de projetos…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText" class="muted" style="margin-top:0"></p>
    <textarea id="dlgInput" rows="4"></textarea>
    <p id="dlgErr" style="color:var(--bad);font-size:13px;margin:6px 0 0;min-height:18px"></p>
    <div class="row" style="justify-content:flex-end;margin-top:8px">
      <button class="btn" value="cancel" type="button" id="dlgCancel">Cancelar</button>
      <button class="btn primary" value="ok" type="submit" id="dlgOk">Confirmar</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
/* ============ Configuração ============ */
let USERS=[];   // carregados de /api/usuarios (hub: pessoas do hub + demonstração)
const PERFIL={solicitante:'Solicitante',validador:'Engenharia / Analista',gestor:'Gestor da unidade',gerente_executivo:'Gerente Executivo',pmo:'Administrador PMO'};
const UNIDADES=[];   // perfil da organização (hub ou config/organizacao.json)
const DIRETORIAS=[];
const STATUS=['Ativo','Suspenso','Cancelado'];
const URG=['Baixa','Média','Alta','Crítica'];
const MATS=['Elegível','Em maturação','Em risco','Não elegível'];
const MAT_CLASS={'Elegível':'eleg','Em maturação':'mat','Em risco':'risk','Não elegível':'no'};
const GATES=['FSE','BC','FSP','ELEG'];
const ETAPA_NOME={FSE:'FSE',BC:'Business Case',FSP:'FSP',ELEG:'Elegibilidade',MADURO:'Maduro'};
const IDX={FSE:0,BC:1,FSP:2,ELEG:3,MADURO:4};
const GATE_APROVA={FSE:['validador','pmo'],BC:['gestor','pmo'],FSP:['validador','pmo'],ELEG:['pmo']};
const GATE_CRIT={FSE:'Demanda válida e responsável definido',BC:'Solução preliminar e justificativa aprovadas',FSP:'Projeto tecnicamente estruturado',ELEG:'Maturidade suficiente para entrada no PQQ'};
const REGRA={diasPorGate:45};
const DOC_TIPOS=['FSE','Business Case','FSP','TAP','Estimativa','Cronograma','Estudo','Aprovação','Outro'];
const CAMPOS={
  FSE:[['fse.area','Área demandante','text'],['fse.urgencia','Urgência','sel:URG'],['fse.problema','Problema ou necessidade','area'],['fse.justificativa','Justificativa inicial','area']],
  BC:[['nome','Nome oficial do projeto','text'],['bc.capexInicial','CAPEX inicial (R$)','num'],['bc.prazo','Prazo estimado (meses)','int'],['bc.objetivo','Objetivo do projeto','area'],['bc.escopo','Escopo preliminar','area'],['bc.alternativas','Alternativas avaliadas','area'],['bc.beneficios','Benefícios','area'],['bc.riscos','Riscos','area']],
  FSP:[['fsp.escopo','Escopo consolidado','area'],['fsp.premissas','Premissas','area'],['fsp.riscos','Riscos','area'],['fsp.docTecnica','Documentação técnica de referência','area']],
  ELEG:[]
};
const EAPS={
  'obras':{nome:'EAP padrão · Obras / Implantação',atividades:['Estudos e levantamentos','Projeto básico','Projeto executivo','Licenciamento / autorizações','Contratação','Mobilização','Implantação / execução','Testes','Comissionamento','Encerramento']},
  'sistemas':{nome:'EAP padrão · Sistemas / Tecnologia',atividades:['Levantamento de requisitos','Arquitetura e projeto','Contratação / aquisição','Desenvolvimento / configuração','Integração','Testes','Implantação','Treinamento','Estabilização','Encerramento']},
  'equipamentos':{nome:'EAP padrão · Equipamentos / Ativos',atividades:['Especificação técnica','Engenharia','Contratação','Fabricação / aquisição','Inspeções','Entrega','Instalação','Testes','Comissionamento','Encerramento']}
};
const CRITICOS=['capexAno','bc.capexInicial','bc.escopo','fsp.escopo','bc.prazo','fsp.atividades','status','cicloId'];
const REQ={
  FSE:[['fse.problema','Problema ou necessidade'],['fse.justificativa','Justificativa inicial'],['responsavel','Responsável']],
  BC:[['bc.objetivo','Objetivo'],['bc.escopo','Escopo preliminar'],['bc.beneficios','Benefícios'],['bc.capexInicial','CAPEX inicial'],['bc.prazo','Prazo estimado (meses)']],
  FSP:[['fsp.escopo','Escopo consolidado'],['fsp.premissas','Premissas'],['@atividades','Cronograma físico-financeiro']],
  ELEG:[['cicloId','Ciclo PQQ pretendido'],['@capexAno','Distribuição financeira gerada pela FSP']]
};

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso=()=>new Date().toISOString();

const _escRx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function prepararRotulos(map){ROT=Object.entries(map||{}).filter(([k,t])=>k&&t&&k!==t).sort((a,b)=>b[0].length-a[0].length).map(([k,t])=>[new RegExp('(^|[^\\wÀ-ÿ])'+_escRx(k)+'(?![\\wÀ-ÿ])','g'),t]);}
function rotularTexto(t){if(!t||!ROT.length)return t;let r=String(t);for(const [rx,s] of ROT)r=r.replace(rx,(_,p)=>p+s);return r;}
const _rotVistos=new WeakMap();
function rotularNo(n){
  if(n.nodeType===3){if(_rotVistos.get(n)===n.nodeValue)return;const v=rotularTexto(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;_rotVistos.set(n,n.nodeValue);return;}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE'||n.tagName==='TEXTAREA'||n.isContentEditable)return;
  for(const a of ['placeholder','title','aria-label']){const v=n.getAttribute(a);if(v){const r=rotularTexto(v);if(r!==v)n.setAttribute(a,r);}}
  n.childNodes.forEach(rotularNo);
}
function ativarRotulos(){
  rotularNo(document.body);document.title=rotularTexto(document.title);
  new MutationObserver(ms=>{for(const x of ms){if(x.type==='characterData')rotularNo(x.target);else x.addedNodes.forEach(rotularNo);}}).observe(document.body,{childList:true,subtree:true,characterData:true});
  const _c=window.confirm.bind(window),_p=window.prompt.bind(window),_a=window.alert.bind(window);
  window.confirm=m=>_c(rotularTexto(m));window.prompt=(m,d)=>_p(rotularTexto(m),d);window.alert=m=>_a(rotularTexto(m));
}
function _mix(hex,alvo,p){const h=hex.replace('#','');const c=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));const t=alvo==='w'?255:0;return '#'+c.map(v=>Math.round(v+(t-v)*p).toString(16).padStart(2,'0')).join('');}

async function api(method,url,body,isForm){
  const headers=USER&&USER.id?{'X-Usuario':USER.id}:{};
  if(body!==undefined&&!isForm)headers['Content-Type']='application/json';
  const r=await fetch(appUrl(url),{method,headers,body:body===undefined?undefined:(isForm?body:JSON.stringify(body))});
  let data=null;try{data=await r.json();}catch(e){}
  if(!r.ok){
    const det=data&&data.detail;
    const e=new Error(typeof det==='string'?det:(det&&det.mensagem)||('Erro '+r.status+' no servidor'));
    e.status=r.status;e.data=det;throw e;
  }
  return data;
}
async function carregar(){
  const [ps,cs,est]=await Promise.all([api('GET','/api/projetos'),api('GET','/api/ciclos'),api('GET','/api/estado')]);
  S.projetos=new Map(ps.map(p=>[p.id,p]));S.ciclos=new Map(cs.map(c=>[c.id,c]));S.assinatura=est.assinatura;
}
function enqueue(key,fn){const prev=S.queues.get(key)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);S.queues.set(key,next);return next;}
async function writeDoc(col,obj){

    (col==='projetos'?S.projetos:S.ciclos).set(saved.id,saved);

}

function desenharSync(){const b=$('#syncBox');if(!b||!SYNC||!(META&&META.modo==='hub'))return;b.hidden=false;b.className='sync '+(SYNC.ok===false?'bad':'ok');

async function sincronizarAgora(manual){

/* ============ Regras de negócio ============ */
const isPMO=u=>u.perfil==='pmo';
function podeVer(p,u){
  if(u.perfil==='pmo'||u.perfil==='validador'||u.perfil==='gerente_executivo')return true;
  if(u.perfil==='gestor')return p.unidade===u.unidade;
  return p.solicitanteId===u.id||p.unidade===u.unidade;
}
function podeEditar(p,u){
  if(isPMO(u))return true;
  if(p.status==='Cancelado')return false;
  return (u.perfil==='solicitante'&&p.solicitanteId===u.id)||(u.perfil==='validador'&&p.solicitanteId!==u.id);
}
function podeCriar(u){return u.perfil==='solicitante'||isPMO(u);}
function podeAprovar(p,g,u){
  if(!GATE_APROVA[g].includes(u.perfil))return false;
  if(u.perfil==='gestor'&&p.unidade!==u.unidade)return false;
  return true;
}
function secaoLiberada(p,sec){return sec==='resumo'||IDX[p.estagio]>=IDX[sec];}
function podeEditarSecao(p,u,sec){
  if(!podeEditar(p,u)||!secaoLiberada(p,sec))return false;
  if(['BC','FSP'].includes(sec)&&(u.perfil!=='validador'&&u.perfil!=='pmo'||p.solicitanteId===u.id))return false;
  if(isPMO(u))return true;
  if(u.perfil==='validador')return p.gates[sec].status!=='em_validacao';
  if(sec==='resumo')return !(p.gates[p.estagio]&&p.gates[p.estagio].status==='em_validacao');
  return p.gates[sec].status!=='em_validacao';
}
const capexAnoTotal=p=>Object.values(p.capexAno||{}).reduce((a,b)=>a+(Number(b)||0),0);
const capexTotal=p=>((p.pqq||{}).retorno||{}).status==='aprovado'?Number(p.pqq.retorno.orcamento_total)||0:(capexAnoTotal(p)||Number(p.capexEstimado)||0);
function anos(){
  const y=new Date().getFullYear();let max=y+6;
  S.ciclos.forEach(c=>{if(c.fim>max)max=c.fim;});
  S.projetos.forEach(p=>Object.keys(p.capexAno||{}).forEach(k=>{if(+k>max)max=+k;}));
  const a=[];for(let i=y;i<=Math.min(max,y+15);i++)a.push(i);return a;
}
function ciclosOrdenados(){return [...S.ciclos.values()].sort((a,b)=>a.corte.localeCompare(b.corte));}
const fimCorte=c=>new Date(c.corte+'T23:59:59');
function proximoCiclo(){const t=new Date();return ciclosOrdenados().find(c=>fimCorte(c)>=t)||null;}
function cicloDo(p){return (p.cicloId&&S.ciclos.get(p.cicloId))||null;}
const diasAte=c=>Math.floor((fimCorte(c)-new Date())/864e5);
function maturidade(p){
  if(p.status==='Cancelado')return 'Não elegível';
  if(p.maturidadeManual)return p.maturidadeManual;
  if(p.gates.ELEG.status==='aprovado')return 'Elegível';
  const c=cicloDo(p);if(!c)return 'Em maturação';
  const dias=diasAte(c);if(dias<0)return 'Não elegível';
  const need=(4-IDX[p.estagio])*REGRA.diasPorGate;
  let r=dias>=need*1.3?'Em maturação':dias>=need*0.7?'Em risco':'Não elegível';
  if(r==='Em maturação'&&GATES.some(g=>p.gates[g].status==='devolvido'))r='Em risco';
  return r;
}
function situacao(p){
  if(p.status!=='Ativo')return p.status;
  const q=p.pqq||{}, t=p.tap||{}, m=p.pmp||{};
  if(m.status==='publicado'||m.status==='recebido')return 'Na PMP';
  if(t.status==='aprovado')return 'TAP aprovada · aguardando PMP';
  if(t.status==='em_aprovacao')return 'Aguardando aprovação da TAP';
  if(t.status==='em_analise_engenharia')return 'Em análise da Engenharia · TAP';
  if(t.status==='devolvido')return 'TAP devolvida para ajuste';
  if(q.status==='aprovado'||(q.retorno||{}).status==='aprovado')return 'PQQ aprovado · aguardando Engenharia';
  if(q.status==='em_analise')return 'Em análise no PQQ';
  if(q.status==='enviado')return 'Aguardando aprovação PQQ';
  if(q.status==='publicando')return 'Publicando no PQQ';
  if(q.status==='liberado_para_envio')return 'Liberado para envio ao PQQ';
  if(q.status==='em_aprovacao_envio')return 'Aguardando aprovação do Gerente Executivo';
  if(q.status==='devolvido_para_ajuste')return 'Devolvido para ajuste';
  if(p.estagio==='MADURO')return 'Elegível · aguardando fluxo PQQ';
  return {rascunho:'Em elaboração',em_validacao:'Em validação',devolvido:'Devolvido para ajuste',aprovado:'Aprovado'}[p.gates[p.estagio].status];
}
function faltando(p,g){
  return REQ[g].filter(([f])=>f==='@capexAno'?capexAnoTotal(p)<=0:f==='@atividades'?!(p.fsp&&p.fsp.atividades&&p.fsp.atividades.length):vazio(getP(p,f))).map(x=>x[1]);
}
function rotulo(campo){
  if(campo.startsWith('capexAno.'))return 'CAPEX '+campo.split('.')[1];if(campo==='fsp.atividades')return 'Cronograma físico-financeiro';
  for(const k in CAMPOS){const f=CAMPOS[k].find(x=>x[0]===campo);if(f)return (k==='resumo'?'':ETAPA_NOME[k]+' · ')+f[1];}
  return {estagio:'Estágio',maturidadeManual:'Maturidade (manual)',caminho:'Caminho de saída'}[campo]||campo;
}
function addHist(p,e){(p.hist=p.hist||[]).push(Object.assign({em:nowIso(),por:USER.nome,perfil:PERFIL[USER.perfil]},e));}
function visiveis(){return [...S.projetos.values()].filter(p=>podeVer(p,USER));}
function filtrados(){
  const f=S.filtros,b=S.busca.trim().toLowerCase();
  return visiveis().filter(p=>(!f.unidade||p.unidade===f.unidade)&&(!f.diretoria||p.diretoria===f.diretoria)&&(!f.estagio||p.estagio===f.estagio)
    &&(!f.ciclo||(cicloDo(p)||{}).id===f.ciclo)&&(!f.status||situacao(p)===f.status)
    &&(!b||(p.nome+' '+p.id+' '+(p.pep||'')+' '+(p.responsavel||'')).toLowerCase().includes(b)));
}
function fila(){
  const out=[];
  visiveis().forEach(p=>{
    if(p.status!=='Ativo')return;
    GATES.forEach(g=>{
      const s=p.gates[g];
      if(s.status==='em_validacao'&&podeAprovar(p,g,USER))out.push({p,tipo:'Validar Gate '+ETAPA_NOME[g],aba:'validacoes'});
      if(s.status==='devolvido'&&podeEditar(p,USER)&&!isPMO(USER))out.push({p,tipo:'Ajustar '+ETAPA_NOME[g]+' devolvido',aba:g});
    });
    if(p.caminho==='extraordinario'&&p.extra&&p.extra.status==='solicitado'&&(isPMO(USER)||(USER.perfil==='gestor'&&USER.unidade===p.unidade)))
      out.push({p,tipo:'Decidir rota extraordinária',aba:'validacoes'});
    const pp=p.pqq||{}, tap=p.tap||{};
    if(pp.status==='em_aprovacao_envio'&&(USER.perfil==='gerente_executivo'||isPMO(USER)))out.push({p,tipo:'Aprovar envio ao PQQ',aba:'fluxo'});
    if(pp.retorno&&pp.retorno.status==='aprovado'&&['em_analise_engenharia','devolvido'].includes(tap.status)&&(USER.perfil==='validador'||isPMO(USER)))out.push({p,tipo:'Revisar escopo e cronograma do TAP',aba:'fluxo'});
    if(tap.status==='em_aprovacao'&&(USER.perfil==='gerente_executivo'||isPMO(USER)))out.push({p,tipo:'Aprovar TAP',aba:'fluxo'});
  });
  return out;
}

/* ============ Diálogo ============ */
function pedirTexto(titulo,texto,obrigatorio=true){
  return new Promise(res=>{
    const d=$('#dlg');$('#dlgTitle').textContent=titulo;$('#dlgText').textContent=texto;$('#dlgInput').value='';$('#dlgErr').textContent='';
    const done=v=>{d.close();cleanup();res(v);};
    const onSubmit=ev=>{ev.preventDefault();const v=$('#dlgInput').value.trim();if(obrigatorio&&!v){$('#dlgErr').textContent='Escreva um comentário para continuar.';return;}done(v||'');};
    const onCancel=()=>done(null);
    const onClose=()=>{cleanup();res(null);};
    function cleanup(){$('#dlgForm').removeEventListener('submit',onSubmit);$('#dlgCancel').removeEventListener('click',onCancel);d.removeEventListener('cancel',onClose);}
    $('#dlgForm').addEventListener('submit',onSubmit);$('#dlgCancel').addEventListener('click',onCancel);d.addEventListener('cancel',onClose);
    d.showModal();$('#dlgInput').focus();
  });
}

  if(isPMO(USER))items.push(['integracoes','Integração PQQ / PMP'],['usuarios','Usuários e perfis']);
  if(podeCriar(USER))items.splice(2,0,['novo','Novo projeto']);
  const notifHub=META&&META.modo==='hub'&&window.STRATHUB&&window.STRATHUB.temNotificacoes;

    +(notifHub?`<a href="#" id="oNotif">🔔 Notificações${S.notif?`<span class="count">${S.notif}</span>`:''}</a>`:'');

  const erro=e=>{console.error(e);m.innerHTML=`<h1>Algo deu errado</h1><div class="note bad">${esc(e&&e.message||e)}</div><div class="row" style="margin-top:12px"><a class="btn primary" href="#/torre">← Voltar ao início</a>${META&&META.modo==='hub'?'<a class="btn" href="/">Portal STRAT·HUB</a>':''}</div>`;};
  try{
    let r;
    if(route==='solicitacoes'){r=viewSolicitacoes();}
    else if(route==='portfolio'){m.innerHTML=viewPortfolio();bindPortfolio();}
    else if(route==='projeto'){r=viewProjeto(parts[1],parts[2]||'resumo');}
    else if(route==='novo'){m.innerHTML=viewNovo();bindNovo();}
    else if(route==='fila'){m.innerHTML=viewFila();}
    else if(route==='ciclos'){m.innerHTML=viewCiclos();bindCiclos();}
    else if(route==='integracoes'){r=viewIntegracoes();}
    else if(route==='usuarios'){r=viewUsuarios();}
    else renderTorre();
    if(r&&r.catch)r.catch(erro);
  }catch(e){erro(e);}
}

/* ============ Exportação ============ */
function linhasExport(ps){
  const as=anos();
  return ps.map(p=>{const c=cicloDo(p);const r={ID:p.id,PEP:p.pep||'',Projeto:p.nome,Unidade:p.unidade,Diretoria:p.diretoria,Responsavel:p.responsavel||'',Solicitante:p.solicitante||'',
    Estagio:ETAPA_NOME[p.estagio],Situacao:situacao(p),Status:p.status,Caminho:p.caminho==='extraordinario'?'Extraordinário':'Regular',
    Ciclo:c?c.nome:'',Maturidade:maturidade(p),CAPEX_Total_nominal:capexTotal(p),CAPEX_Estimado_nominal:Number(p.capexEstimado)||0};
    as.forEach(a=>r['CAPEX_'+a+'_nominal']=Number((p.capexAno||{})[a])||0);
    GATES.forEach(g=>r['Gate_'+g]=p.gates[g].status);
    r.Criado_em=p.criadoEm;r.Atualizado_em=p.atualizadoEm;return r;});
}
function baixarBlob(blob,filename){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
async function exportar(fmt,ps){
  const stamp=new Date().toISOString().slice(0,10);
  const filename=`originacao-projetos-${stamp}.${fmt}`;
  try{
    if(fmt==='json'){
      baixarBlob(new Blob([JSON.stringify({exportadoEm:nowIso(),exportadoPor:USER.nome,ciclos:ciclosOrdenados(),projetos:ps.map(p=>Object.assign(clone(p),{maturidadeCalculada:maturidade(p),capexTotal:capexTotal(p)}))},null,2)],{type:'application/json'}),filename);
    }else if(fmt==='csv'){
      const rows=linhasExport(ps);
      const cols=rows.length?Object.keys(rows[0]):['ID'];
      const cell=v=>{let s=typeof v==='number'?v.toLocaleString('pt-BR',{useGrouping:false,maximumFractionDigits:2}):String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
      baixarBlob(new Blob(['\ufeff'+[cols.join(';')].concat(rows.map(r=>cols.map(c=>cell(r[c])).join(';'))).join('\r\n')],{type:'text/csv'}),filename);
    }else{
      const r=await fetch(appUrl('/api/exportar/xlsx'),{method:'POST',headers:{'Content-Type':'application/json','X-Usuario':USER.id},
        body:JSON.stringify({linhas:linhasExport(ps),ciclos:ciclosOrdenados().map(c=>({ID:c.id,Ciclo:c.nome,Abertura:c.abertura,Corte:c.corte,Inicio:c.inicio,Fim:c.fim}))})});
      if(!r.ok)throw new Error('Erro '+r.status);
      baixarBlob(await r.blob(),filename);
    }
    toast('Arquivo exportado.');
  }catch(e){toast('Não foi possível exportar: '+(e.message||'erro'));}
}

function linhaProjeto(p){
  const idx=IDX[p.estagio];
  const q=p.pqq||{},t=p.tap||{},m=p.pmp||{};
  const fases=['FSE','BC','FSP','ELEG','PQQ','TAP','PMP'];
  const atual=idx<4?idx:((m.status==='publicado'||m.status==='recebido'||m.status==='pronto_para_publicacao'||t.status==='aprovado')?6:((t.status||q.status==='aprovado'||(q.retorno||{}).status==='aprovado')?5:4));
  const qStatus=q.status==='em_aprovacao_envio'?'aguardando aprovação do Gerente Executivo':q.status==='liberado_para_envio'?'liberado para envio':q.status==='publicando'?'publicando no PQQ':q.status==='enviado'?'aguardando aprovação PQQ':q.status==='em_analise'?'em análise no PQQ':q.status==='aprovado'?'aprovado no PQQ':'';
  const tStatus=t.status==='em_analise_engenharia'?'em análise da Engenharia':t.status==='em_aprovacao'?'aguardando aprovação da TAP':t.status==='aprovado'?'TAP aprovada':t.status==='devolvido'?'devolvido para ajuste':'';
  const pStatus=m.status==='pronto_para_publicacao'?'aguardando publicação':m.status==='publicado'||m.status==='recebido'?'na PMP':'';
  const sub=[
    ...['FSE','BC','FSP','ELEG'].map((k,i)=>({rascunho:i===idx?'em elaboração':'',em_validacao:'em validação',devolvido:'devolvido',aprovado:'aprovado'}[p.gates[k].status]||'')),
    qStatus,tStatus,pStatus
  ];
  const done=[...['FSE','BC','FSP','ELEG'].map(k=>p.gates[k].status==='aprovado'),
    ['enviado','em_analise','aprovado'].includes(q.status),['em_aprovacao','aprovado'].includes(t.status),m.status==='publicado'||m.status==='recebido'];
  const fillPct=done.filter(Boolean).length/6*80;
  return `<div class="pline"><div class="pfill" style="width:${fillPct}%"></div>
   ${fases.map((k,i)=>{
     let cls='',mark='';
     if(i<4){const st=p.gates[k].status;if(st==='aprovado'){cls='done';mark='✓';}else if(i===idx){cls=st==='em_validacao'?'wait':st==='devolvido'?'back':'cur';mark=st==='em_validacao'?'…':st==='devolvido'?'!':'';}}
     else if(done[i]){cls='done';mark='✓';}
     else if(i===atual){cls=(i===4&&q.status==='publicando')?'wait':(i===4&&q.status==='devolvido_para_ajuste')?'back':'cur';mark=cls==='wait'?'…':cls==='back'?'!':'';}
     const liberada=i<4?(i<=idx||p.gates[k].status==='aprovado'):true;
     const href=i<4?`#/projeto/${encodeURIComponent(p.id)}/${k}`:`#/projeto/${encodeURIComponent(p.id)}/${i===6?'resumo':'fluxo'}`;
     return `<div class="pst ${cls}${liberada?'':' locked'}"><a href="${href}"><div class="pdot" aria-hidden="true">${mark}</div><b>${({FSE:'FSE',BC:'BC',FSP:'FSP',ELEG:'Elegibilidade',PQQ:'PQQ',TAP:'TAP',PMP:'PMP'})[k]}</b><small>${sub[i]||''}</small></a></div>`;}).join('')}
  </div>`;
}
function campoHtml(p,[f,label,tipo],editavel){

function gerarDistribuicao(atividades){
  const mensal={}, anual={};
  (atividades||[]).forEach(a=>{const custo=Number(a.custo)||0;if(!a.inicio||!a.fim||custo<=0)return;let d=new Date(a.inicio+'T12:00:00');const e=new Date(a.fim+'T12:00:00');if(e<d)return;const meses=[];let cur=new Date(d.getFullYear(),d.getMonth(),1,12);const end=new Date(e.getFullYear(),e.getMonth(),1,12);while(cur<=end){meses.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0'));cur.setMonth(cur.getMonth()+1);}const v=custo/Math.max(1,meses.length);meses.forEach((m,i)=>{const vv=i===meses.length-1?custo-v*(meses.length-1):v;mensal[m]=(mensal[m]||0)+vv;const y=m.slice(0,4);anual[y]=(anual[y]||0)+vv;});});
  return {mensal,anual};
}

function etapaPill(label,status){
  const cls={aprovado:'b-eleg',liberado_para_envio:'b-eleg',enviado:'b-mat',em_analise:'b-mat',em_aprovacao:'b-mat',em_aprovacao_envio:'b-mat',devolvido:'b-risk',devolvido_para_ajuste:'b-risk',em_analise_engenharia:'b-mat',pronto_para_publicacao:'b-eleg'}[status]||'b-neutral';
  const nomes={aprovado:'Aprovado',liberado_para_envio:'Liberado para envio',enviado:'Aguardando aprovação PQQ',em_analise:'Em análise no PQQ',em_aprovacao:'Aguardando aprovação',em_aprovacao_envio:'Aguardando aprovação',devolvido:'Devolvido',devolvido_para_ajuste:'Devolvido para ajuste',em_analise_engenharia:'Em análise da Engenharia',pronto_para_publicacao:'Pronto para publicação na PMP'};
  return `<span class="badge ${cls}">${esc(label)} · ${esc(nomes[status]||status||'Não iniciado')}</span>`;
}

    ${engenharia||'<section class="panel"><h2>2 · Retorno do PQQ e TAP</h2><p class="muted">Esta etapa será liberada quando o PQQ retornar o orçamento aprovado no lote.</p></section>'}

/* ============ Ações da ficha ============ */
function coletar(p,scope){
  const novo=clone(p);const mud=[];
  (scope||document).querySelectorAll('[data-f]').forEach(el=>{
    const f=el.dataset.f;let v=el.value;
    if(el.dataset.t==='num')v=v===''?null:Number(v);else v=v.trim();
    const old=getP(p,f);
    const a=vazio(old)?'':String(old),b=vazio(v)?'':String(v);
    if(a!==b){setP(novo,f,v);mud.push({campo:f,de:vazio(old)?'':old,para:vazio(v)?'':v});}
  });
  const rows=(scope||document).querySelectorAll('[data-ai]');
  if(rows.length){const atividades=[...rows].map(tr=>{const o={};tr.querySelectorAll('[data-af]').forEach(el=>{let v=el.value;if(el.dataset.af==='custo')v=v===''?0:Number(v);o[el.dataset.af]=v;});return o;}).filter(a=>a.nome||a.inicio||a.fim||a.custo);const old=JSON.stringify((p.fsp&&p.fsp.atividades)||[]);if(JSON.stringify(atividades)!==old){novo.fsp=novo.fsp||{};novo.fsp.atividades=atividades;const dist=gerarDistribuicao(atividades);novo.fsp.distribuicaoMensal=dist.mensal;novo.capexAno=dist.anual;novo.capexEstimado=Object.values(dist.anual).reduce((a,b)=>a+Number(b||0),0);mud.push({campo:'fsp.atividades',de:'Cronograma anterior',para:atividades.length+' atividades'});}}
  const eapSel=(scope||document).querySelector('#eapSel');if(eapSel){const old=getP(p,'fsp.eapId')||'';if(old!==eapSel.value){novo.fsp=novo.fsp||{};novo.fsp.eapId=eapSel.value;mud.push({campo:'fsp.eapId',de:old,para:eapSel.value});}}
  if(novo.capexAno)Object.keys(novo.capexAno).forEach(k=>{if(vazio(novo.capexAno[k]))delete novo.capexAno[k];});
  return {novo,mud};
}
async function salvarEdicao(p){
  const {novo,mud}=coletar(p);
  if(!mud.length){toast('Nenhuma alteração para salvar.');return;}
  const neg=mud.find(m=>typeof m.para==='number'&&m.para<0);
  if(neg){toast('Valores de CAPEX não podem ser negativos.');return;}
  const critica=mud.some(m=>CRITICOS.some(c=>m.campo===c||m.campo.startsWith(c+'.')));
  let just='';
  if(critica&&p.gates[p.estagio]?.status==='aprovado'){
    just=await pedirTexto('Justifique a alteração','Este projeto já tem Gate aprovado. Mudanças em CAPEX, escopo, cronograma, status ou ciclo ficam registradas com justificativa.');
    if(just===null)return;
  }
  const atual=S.projetos.get(p.id);
  const base=atual&&atual.atualizadoEm!==p.atualizadoEm?coletar(atual).novo:novo;
  mud.forEach(m=>addHist(base,{acao:'Alteração',campo:rotulo(m.campo),de:m.de,para:m.para,justificativa:just}));
  base.atualizadoEm=nowIso();
  S.editing=false;
  await salvarProjeto(base,mud.length===1?'Alteração salva.':mud.length+' alterações salvas.');
  render();
}
async function enviarGate(p,g){
  const f=faltando(p,g);if(f.length){toast('Faltam dados: '+f.join(', '));return;}
  if(S.editing){toast('Salve ou descarte as alterações antes de enviar.');return;}
  const n=clone(p);const t=nowIso();
  n.gates[g]=Object.assign({},n.gates[g],{status:'em_validacao',enviadoPor:USER.nome,enviadoEm:t});
  (n.validacoes=n.validacoes||[]).push({em:t,por:USER.nome,perfil:PERFIL[USER.perfil],gate:g,acao:'Enviado para validação',comentario:''});
  addHist(n,{acao:'Enviado para validação',campo:'Gate '+ETAPA_NOME[g],de:'',para:''});
  n.atualizadoEm=t;
  await salvarProjeto(n,'Gate '+ETAPA_NOME[g]+' enviado para validação.');render();
}
async function decidirGate(p,g,aprovar){
  const com=await pedirTexto(aprovar?'Aprovar Gate '+ETAPA_NOME[g]:'Devolver para ajuste',aprovar?'Comentário opcional sobre a aprovação.':'Explique o que precisa ser ajustado. O solicitante verá este comentário.',!aprovar);
  if(com===null)return;
  const n=clone(S.projetos.get(p.id));const t=nowIso();
  if(n.gates[g].status!=='em_validacao'){toast('Este Gate já foi decidido por outra pessoa.');render();return;}
  n.gates[g]=Object.assign({},n.gates[g],{status:aprovar?'aprovado':'devolvido',decididoPor:USER.nome,decididoEm:t,comentario:com});
  n.validacoes.push({em:t,por:USER.nome,perfil:PERFIL[USER.perfil],gate:g,acao:aprovar?'Aprovado':'Devolvido para ajuste',comentario:com});
  addHist(n,{acao:aprovar?'Gate aprovado':'Gate devolvido',campo:'Gate '+ETAPA_NOME[g],de:'',para:'',justificativa:com});
  if(aprovar){const prox=['FSE','BC','FSP','ELEG','MADURO'][IDX[g]+1];addHist(n,{acao:'Alteração',campo:'Estágio',de:ETAPA_NOME[n.estagio],para:ETAPA_NOME[prox]});n.estagio=prox;}
  n.atualizadoEm=t;
  await salvarProjeto(n,aprovar?'Gate aprovado. Projeto avançou para '+ETAPA_NOME[n.estagio]+'.':'Projeto devolvido para ajuste.');render();
}
async function atualizarExtra(p,muda,acao,com){
  const n=clone(S.projetos.get(p.id));const t=nowIso();
  muda(n,t);
  addHist(n,{acao,campo:'Rota extraordinária',de:'',para:'',justificativa:com||''});
  n.atualizadoEm=t;S.editing=false;
  await salvarProjeto(n,acao+'.');render();
}
function bindProjeto(p,aba){
  const main=$('#main');
  main.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',()=>{S.editing=true;}));
  main.querySelectorAll('[data-tapf]').forEach(el=>el.addEventListener('input',()=>{S.editing=true;}));
  const sb=$('#saveBtn');if(sb)sb.onclick=()=>salvarEdicao(p);
  const cb=$('#cancelBtn');if(cb)cb.onclick=()=>{S.editing=false;render();};
  main.querySelectorAll('[data-enviar]').forEach(b=>b.onclick=()=>enviarGate(p,b.dataset.enviar));
  main.querySelectorAll('[data-aprovar]').forEach(b=>b.onclick=()=>decidirGate(p,b.dataset.aprovar,true));
  main.querySelectorAll('[data-devolver]').forEach(b=>b.onclick=()=>decidirGate(p,b.dataset.devolver,false));
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
  const atualizarFluxo=async(url,body,msg)=>{try{await api('POST',url,body);S.editing=false;await carregar();toast(msg);render();}catch(e){toast(e.message||'Não foi possível atualizar o fluxo.');}};

    const c=await pedirTexto('Solicitar aprovação executiva','O Gerente Executivo avaliará esta solicitação dentro da Originação, antes do envio ao PQQ. Comentário opcional.',false);if(c===null)return;
    try{await api('POST','/api/projetos/'+encodeURIComponent(p.id)+'/pqq/enviar-aprovacao',{comentario:c});await carregar();toast('Solicitação registrada na fila interna de aprovação da Originação.');render();}catch(e){toast(e.message||'Não foi possível solicitar aprovação.');}
  };
  on('solPqqApr',enviarPqqApr);on('rePqqApr',enviarPqqApr);
  on('aprPqqEnvio',async()=>{const c=await pedirTexto('Aprovar envio ao PQQ','A aprovação libera este projeto para envio individual ou em lote ao PQQ. Comentário opcional.',false);if(c===null)return;
    await atualizarFluxo('/api/projetos/'+encodeURIComponent(p.id)+'/pqq/decidir-envio',{decisao:'aprovar',comentario:c},'Aprovado. Projeto liberado para o PQQ.');});
  on('devPqqEnvio',async()=>{const c=await pedirTexto('Devolver envio ao PQQ','Explique o que precisa ser ajustado antes da aprovação.',true);if(c===null)return;
    await atualizarFluxo('/api/projetos/'+encodeURIComponent(p.id)+'/pqq/decidir-envio',{decisao:'devolver',comentario:c},'Devolvido para ajuste.');});
  const salvarTap=async()=>{
    const escopo=main.querySelector('[data-tapf="escopo"]')?.value.trim()||'';
    const cronograma=main.querySelector('[data-tapf="cronograma"]')?.value.trim()||'';
    const inicio_previsto=main.querySelector('[data-tapf="inicio_previsto"]')?.value||'';
    const conclusao_compromissada=main.querySelector('[data-tapf="conclusao_compromissada"]')?.value||'';
    const premissas=main.querySelector('[data-tapf="premissas"]')?.value.trim()||'';
    if(!escopo||!cronograma||!inicio_previsto||!conclusao_compromissada){toast('Preencha escopo, cronograma, início planejado e conclusão compromissada.');return false;}
    try{await api('PUT','/api/projetos/'+encodeURIComponent(p.id)+'/tap/proposta',{escopo,cronograma,inicio_previsto,conclusao_compromissada,premissas});S.editing=false;await carregar();return true;}
    catch(e){toast(e.message||'Não foi possível salvar a revisão.');return false;}
  };
  on('salvarTapProp',async()=>{if(await salvarTap()) {toast('Revisão da Engenharia salva.');render();}});
  on('enviarTapApr',async()=>{if(!await salvarTap())return;try{await api('POST','/api/projetos/'+encodeURIComponent(p.id)+'/tap/enviar-aprovacao',{});await carregar();toast('TAP encaminhado à aprovação executiva dentro da Originação.');render();}catch(e){toast(e.message||'Não foi possível encaminhar a TAP.');}});
  on('aprTap',async()=>{const c=await pedirTexto('Aprovar TAP','A aprovação formaliza a condição do projeto e o encaminha à fila da PMP. Comentário opcional.',false);if(c===null)return;
    try{await api('POST','/api/projetos/'+encodeURIComponent(p.id)+'/tap/decidir',{decisao:'aprovar',comentario:c});S.editing=false;await carregar();toast('TAP aprovada; projeto encaminhado automaticamente à carteira da PMP.');render();}catch(e){toast(e.message||'Não foi possível concluir a publicação do TAP. Confira a integração.');}});
  on('devTap',async()=>{const c=await pedirTexto('Devolver TAP para ajuste','Explique o que a Engenharia precisa ajustar no escopo ou cronograma.',true);if(c===null)return;
    await atualizarFluxo('/api/projetos/'+encodeURIComponent(p.id)+'/tap/decidir',{decisao:'devolver',comentario:c},'TAP devolvido para ajuste.');});
  on('toExtra',()=>atualizarExtra(p,n=>{n.caminho='extraordinario';n.extra=Object.assign({status:'rascunho',urgencia:'Alta'},n.extra||{},{status:'rascunho'});},'Rota extraordinária iniciada'));
  on('toRegular',()=>atualizarExtra(p,n=>{n.caminho='regular';},'Retorno ao caminho regular'));
  const saveExtraData=async()=>{const {novo,mud}=coletar(p,main);if(!mud.length)return S.projetos.get(p.id);mud.forEach(m=>addHist(novo,{acao:'Alteração',campo:{'extra.motivo':'Extraordinário · Motivo','extra.justificativa':'Extraordinário · Justificativa','extra.urgencia':'Extraordinário · Urgência','extra.capex':'CAPEX não orçado (R$)'}[m.campo]||m.campo,de:m.de,para:m.para}));novo.atualizadoEm=nowIso();S.editing=false;await salvarProjeto(novo);return novo;};
  on('saveExtra',async()=>{await saveExtraData();toast('Dados da rota extraordinária salvos.');render();});
  on('sendExtra',async()=>{const n=await saveExtraData();const e=n.extra||{};const miss=[['motivo','motivo'],['justificativa','justificativa'],['capex','CAPEX']].filter(([k])=>vazio(e[k])).map(x=>x[1]);
    if(miss.length){toast('Preencha: '+miss.join(', ')+'.');render();return;}
    await atualizarExtra(n,x=>{x.extra.status='solicitado';x.extra.solicitadoPor=USER.nome;},'Rota extraordinária enviada para aprovação');});
  on('aprExtra',async()=>{const c=await pedirTexto('Aprovar rota extraordinária','Registre a aprovação extraordinária (ata, e-mail ou decisão).');if(c===null)return;
    await atualizarExtra(p,(x,t)=>{Object.assign(x.extra,{status:'aprovado',decididoPor:USER.nome,decididoEm:t,comentario:c,envioTendencia:'pendente'});},'Rota extraordinária aprovada',c);});
  on('repExtra',async()=>{const c=await pedirTexto('Reprovar rota extraordinária','Explique o motivo.');if(c===null)return;
    await atualizarExtra(p,(x,t)=>{Object.assign(x.extra,{status:'reprovado',decididoPor:USER.nome,decididoEm:t,comentario:c});},'Rota extraordinária reprovada',c);});
  on('tendExtra',()=>atualizarExtra(p,(x,t)=>{x.extra.envioTendencia='enviado';x.extra.enviadoTendenciaEm=t;},'Enviado para Tendência'));
  on('saveCycleEleg',async()=>{const cycle=$('#cycleElegSel')?.value;if(!cycle||!S.ciclos.has(cycle)){toast('Selecione um ciclo PQQ cadastrado.');return;}const n=clone(S.projetos.get(p.id));if(n.cicloId===cycle){toast('Ciclo já confirmado.');return;}const old=n.cicloId||'';n.cicloId=cycle;addHist(n,{acao:'Alteração',campo:'Ciclo PQQ pretendido',de:old,para:cycle});n.atualizadoEm=nowIso();try{await salvarProjeto(n,'Ciclo PQQ confirmado.');S.editing=false;render();}catch(e){toast(e.message||'Não foi possível salvar o ciclo.');}});
  on('matBtn',async()=>{const v=$('#matSel').value;const n=clone(S.projetos.get(p.id));if((n.maturidadeManual||'')===v)return;
    const j=await pedirTexto('Alterar maturidade','Justifique a classificação manual.');if(j===null)return;
    addHist(n,{acao:'Alteração',campo:'Maturidade (manual)',de:n.maturidadeManual||'Automática',para:v||'Automática',justificativa:j});n.maturidadeManual=v;n.atualizadoEm=nowIso();
    await salvarProjeto(n,'Maturidade atualizada.');render();});
  on('loadEap',()=>{const id=$('#eapSel').value;if(!id||!EAPS[id]){toast('Selecione uma EAP padrão.');return;}const tbody=$('#atividadeBody');tbody.innerHTML=EAPS[id].atividades.map((nome,i)=>`<tr data-ai="${i}"><td><input type="text" data-af="nome" value="${esc(nome)}"></td><td><input type="date" data-af="inicio"></td><td><input type="date" data-af="fim"></td><td><input class="money" type="number" step="0.01" min="0" data-af="custo"></td><td><button class="btn small bad" data-rmact="${i}">Remover</button></td></tr>`).join('');S.editing=true;bindActRem();});
  on('addAct',()=>{const tbody=$('#atividadeBody');if(tbody.querySelector('td.muted'))tbody.innerHTML='';const i=tbody.querySelectorAll('[data-ai]').length;tbody.insertAdjacentHTML('beforeend',`<tr data-ai="${i}"><td><input type="text" data-af="nome"></td><td><input type="date" data-af="inicio"></td><td><input type="date" data-af="fim"></td><td><input class="money" type="number" step="0.01" min="0" data-af="custo"></td><td><button class="btn small bad" data-rmact="${i}">Remover</button></td></tr>`);S.editing=true;bindActRem();});
  function bindActRem(){main.querySelectorAll('[data-rmact]').forEach(b=>b.onclick=()=>{b.closest('tr').remove();S.editing=true;});main.querySelectorAll('[data-af],#eapSel').forEach(el=>el.oninput=()=>S.editing=true);}
  bindActRem();
  const atualizarResumoFsp=()=>{const t=[...main.querySelectorAll('[data-af="custo"]')].reduce((v,el)=>v+(Number(el.value)||0),0);const bc=Number(p.bc?.capexInicial)||0;const sum=$('#fspAllocated'),diff=$('#fspBalance');if(sum)sum.textContent=fmtMi(t);if(diff){diff.textContent=fmtMi(bc-t);diff.style.color=t>bc?'#b42318':'';}};
  main.querySelectorAll('[data-af="custo"]').forEach(el=>el.addEventListener('input',atualizarResumoFsp));
  const tbodyWatch=main.querySelector('#atividadeBody');if(tbodyWatch){const obs=new MutationObserver(()=>{main.querySelectorAll('[data-af="custo"]').forEach(el=>{if(!el.dataset.sumBound){el.addEventListener('input',atualizarResumoFsp);el.dataset.sumBound='1';}});atualizarResumoFsp();});obs.observe(tbodyWatch,{childList:true,subtree:true});}atualizarResumoFsp();
  on('addDoc',async()=>{
    const tipo=$('#docTipo').value,nome=$('#docNome').value.trim(),url=$('#docUrl').value.trim();const file=$('#docFile')&&$('#docFile').files[0];
    if(!nome&&!file){toast('Dê um nome ao documento.');return;}
    if(!file&&!/^https?:\/\//i.test(url)){toast('Informe um link começando com https:// ou envie um arquivo.');return;}
    const b=$('#addDoc');b.disabled=true;
    const d={id:Math.random().toString(36).slice(2,10),tipo,nome:nome||(file&&file.name),url:file?'':url,por:USER.nome,em:nowIso()};
    try{
      if(file){b.textContent='Enviando…';const fd=new FormData();fd.append('arquivo',file);const r=await api('POST','/api/projetos/'+encodeURIComponent(p.id)+'/arquivos',fd,true);d.arquivo=r.arquivo;}
      const n=clone(S.projetos.get(p.id));(n.documentos=n.documentos||[]).push(d);
      addHist(n,{acao:'Documento anexado',campo:tipo,de:'',para:d.nome});n.atualizadoEm=nowIso();
      await salvarProjeto(n,'Documento adicionado.');render();
    }catch(e){toast('Não foi possível adicionar o documento: '+(e&&e.message||'erro'));b.disabled=false;b.textContent='Adicionar documento';}
  });
  main.querySelectorAll('[data-rmdoc]').forEach(b=>b.onclick=async()=>{
    const n=clone(S.projetos.get(p.id));const d=(n.documentos||[]).find(x=>x.id===b.dataset.rmdoc);if(!d)return;
    n.documentos=n.documentos.filter(x=>x.id!==d.id);addHist(n,{acao:'Documento removido',campo:d.tipo,de:'',para:d.nome});n.atualizadoEm=nowIso();
    await salvarProjeto(n,'Documento removido.');render();
  });
}

  <div class="stack">
  <div class="tablewrap"><table><thead><tr><th>Ciclo</th><th>Abertura</th><th>Corte</th><th>Período</th><th class="num">Projetos</th><th class="num">CAPEX</th><th>Situação</th>${isPMO(USER)?'<th></th>':''}</tr></thead><tbody>
  ${cs.length?cs.map(c=>{const ps=[...S.projetos.values()].filter(p=>p.status!=='Cancelado'&&(cicloDo(p)||{}).id===c.id);
    const sit=fimCorte(c)<t?'Encerrado':c===prox?(new Date(c.abertura+'T00:00:00')<=t?'Aberto · próximo corte':'Próximo corte'):'Futuro';
    return `<tr><td class="pname">${esc(c.nome)}</td><td>${fmtData(c.abertura)}</td><td>${fmtData(c.corte)}</td><td>${c.inicio}–${c.fim}</td><td class="num">${ps.length}</td><td class="num">${fmtMi(ps.reduce((a,p)=>a+capexTotal(p),0))}</td>
     <td><span class="badge ${sit==='Encerrado'?'b-neutral':sit.startsWith('Aberto')||sit==='Próximo corte'?'b-mat':'b-neutral'}">${sit}</span></td>${isPMO(USER)?`<td><button class="btn small" data-editc="${esc(c.id)}">Editar</button></td>`:''}</tr>`;}).join('')
  :`<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">Nenhum ciclo cadastrado.${isPMO(USER)?' Use o formulário abaixo.':' O PMO cadastra os ciclos.'}</td></tr>`}
  </tbody></table></div>
  ${isPMO(USER)?`<section class="panel" id="cicloPanel"><h2 id="cicloTitle">Cadastrar ciclo</h2><input type="hidden" id="cId"><div class="form">
   <label class="field"><span>Nome</span><input type="text" id="cNome" placeholder="PQQ 2028–2032"></label>
   <label class="field"><span>Data de abertura</span><input type="date" id="cAb"></label>
   <label class="field"><span>Data de corte</span><input type="date" id="cCorte"></label>
   <label class="field"><span>Ano inicial</span><input type="number" id="cIni" min="2020" max="2100"></label>
   <label class="field"><span>Ano final</span><input type="number" id="cFim" min="2020" max="2100"></label>
  </div><p id="cErr" style="color:var(--bad);font-size:14px;min-height:20px"></p>
  <div class="row"><button class="btn primary" id="cSave">Salvar ciclo</button><button class="btn" id="cReset" hidden>Cancelar edição</button></div></section>`:''}
  ${isPMO(USER)?`<section class="panel"><h2>Base de testes</h2><p class="muted" style="margin-top:0">Apaga todos os projetos, ciclos, históricos e arquivos deste servidor. Use para recomeçar um teste.</p><button class="btn bad" id="zerarBtn">Zerar base de testes</button></section>`:''}
  <section class="panel"><h2>Como a maturidade é calculada</h2>
   <p style="max-width:75ch;margin-top:0">Para cada projeto, a ferramenta compara os dias até o corte do ciclo pretendido com o tempo estimado para passar pelos Gates que faltam (${REGRA.diasPorGate} dias por Gate).</p>
   <ul class="list-plain" style="max-width:75ch">
    <li><span class="badge b-eleg">Elegível</span><span>Gate de Elegibilidade aprovado.</span></li>
    <li><span class="badge b-mat">Em maturação</span><span>Tempo até o corte cobre com folga (30%) os Gates restantes.</span></li>
    <li><span class="badge b-risk">Em risco</span><span>Tempo entre 70% e 130% do necessário, ou algum Gate devolvido.</span></li>
    <li><span class="badge b-no">Não elegível</span><span>Tempo abaixo de 70% do necessário, corte já passou ou projeto cancelado.</span></li>
   </ul><p class="meta">O PMO pode fixar a classificação manualmente na aba Validações do projeto.</p>
  </section></div>`;
}
function bindCiclos(){
  const z=$('#zerarBtn');if(z)z.onclick=async()=>{const t=await pedirTexto('Zerar base de testes','Digite ZERAR para confirmar. Esta ação não pode ser desfeita.');if(t===null)return;if(t.trim().toUpperCase()!=='ZERAR'){toast('Confirmação incorreta. Nada foi apagado.');return;}
    try{await api('POST','/api/admin/zerar');await carregar();toast('Base de testes zerada.');location.hash='#/torre';render();}catch(e){toast('Não foi possível zerar: '+e.message);}};
  const save=$('#cSave');if(!save)return;
  const fill=c=>{$('#cId').value=c?c.id:'';$('#cNome').value=c?c.nome:'';$('#cAb').value=c?c.abertura:'';$('#cCorte').value=c?c.corte:'';$('#cIni').value=c?c.inicio:'';$('#cFim').value=c?c.fim:'';
    $('#cicloTitle').textContent=c?'Editar '+c.nome:'Cadastrar ciclo';$('#cReset').hidden=!c;$('#cErr').textContent='';};
  document.querySelectorAll('[data-editc]').forEach(b=>b.onclick=()=>{fill(S.ciclos.get(b.dataset.editc));$('#cicloPanel').scrollIntoView({behavior:'smooth',block:'start'});});
  $('#cReset').onclick=()=>fill(null);
  save.onclick=async()=>{
    const c={id:$('#cId').value||('c-'+Math.random().toString(36).slice(2,9)),nome:$('#cNome').value.trim(),abertura:$('#cAb').value,corte:$('#cCorte').value,inicio:Number($('#cIni').value),fim:Number($('#cFim').value)};
    const miss=[];if(!c.nome)miss.push('nome');if(!c.abertura)miss.push('abertura');if(!c.corte)miss.push('corte');if(!c.inicio||!c.fim)miss.push('período');
    if(miss.length){$('#cErr').textContent='Preencha: '+miss.join(', ')+'.';return;}
    if(c.corte<c.abertura){$('#cErr').textContent='A data de corte deve ser depois da abertura.';return;}
    if(c.fim<c.inicio){$('#cErr').textContent='O ano final deve ser maior ou igual ao inicial.';return;}
    try{await writeDoc('ciclos',c);toast('Ciclo salvo.');render();}catch(e){$('#cErr').textContent='Não foi possível salvar: '+(e.message||e);}
  };
}

      <details class="conting" ${hub?'':'open'}><summary>${hub?'Contingência: importar retorno por arquivo JSON':'Importar retorno por arquivo JSON'}</summary><div class="row" style="margin-top:8px"><input id="pqqReturnFile" type="file" accept="application/json,.json"><button class="btn" id="importPqqReturn">Importar arquivo JSON</button></div></details>
      <details style="margin-top:14px"><summary>Formato do retorno (arquivo JSON)</summary><pre class="code">${esc(JSON.stringify({schema_version:'2.0',tipo:'plano_para_originacao',lote_id:'RET-AAAAMMDD-001',projetos:[{id_mestre:'ORI-000001',plano_id:'PPI-0001',ciclo_id:'c-2027',ciclo_inicio:2027,ciclo_fim:2031,status:'aprovado',orcamento_total:1000000,curva_mensal:{'2027-01':500000,'2027-02':500000},aprovado_por:'Comitê',aprovado_em:'2026-10-15',comentario:''}]},null,2))}</pre></details></section>
      <section class="panel"><div class="row"><h2 style="margin:0">Projetos encaminhados à PMP</h2><span class="spacer"></span><button class="btn" id="exportPmpQueue" ${pmp.length?'':'disabled'}>Baixar pacote de integração</button></div><p class="meta">A aprovação do TAP publica projeto, curva aprovada e PDF no Data Core; a PMP inclui o projeto na carteira automaticamente. ${publicados} de ${pmp.length} já publicado(s).</p>
      <div class="tablewrap"><table><thead><tr><th>ID mestre</th><th>Projeto</th><th>Unidade</th><th>Orçamento PQQ</th><th>Aprovação TAP</th><th>Publicação</th></tr></thead><tbody>${pmp.length?pmp.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.nome)}</td><td>${esc(p.unidade||'')}</td><td class="num">${fmtMi(((p.pqq||{}).retorno||{}).orcamento_total)}</td><td>${fmtDH((p.pmp||{}).aprovado_em)}</td><td>${(p.pmp||{}).status==='publicado'?'Publicado '+fmtDH((p.pmp||{}).publicado_em):'<span class="muted">Pendente</span>'}</td></tr>`).join(''):'<tr><td colspan="6" class="muted">Nenhum TAP aprovado.</td></tr>'}</tbody></table></div></section>
      <section class="panel"><h2>Histórico de lotes PQQ</h2><div class="tablewrap"><table><thead><tr><th>Lote</th><th>Direção</th><th>Data</th><th>Itens</th><th>Situação</th></tr></thead><tbody>${lotes.length?lotes.map(l=>`<tr><td>${esc(l.id)}</td><td>${l.tipo==='PQQ_ENVIO'?'Originação → PQQ':'PQQ → Originação'}</td><td>${fmtDH(l.criado_em)}</td><td>${l.total}</td><td>${esc(l.status)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">Nenhum lote processado.</td></tr>'}</tbody></table></div></section>
      </div>`;
    const checkAll=$('#checkAllPqq');if(checkAll)checkAll.onchange=()=>document.querySelectorAll('[data-pqqsel]').forEach(x=>x.checked=checkAll.checked);
    $('#sendPqqBatch').onclick=async()=>{
      const ids=[...document.querySelectorAll('[data-pqqsel]:checked')].map(x=>x.dataset.pqqsel);
      if(!ids.length){toast('Selecione ao menos um projeto.');return;}
      try{const r=await api('POST','/api/integracoes/pqq/envios',{projeto_ids:ids});toast('Envio publicado no PQQ pelo hub · '+r.total+' projeto(s).');}
      catch(e){toast(e.message||'Não foi possível enviar.');}
      await carregar();viewIntegracoes();
    };
    $('#importPqqHub').onclick=async()=>{
      try{const r=await api('POST','/api/integracoes/pqq/retornos/sincronizar');toast(r.lotes.length?'Retornos recebidos: '+r.importados+' projeto(s).':'Não há retornos do PQQ pendentes.');await carregar();viewIntegracoes();}
      catch(e){toast(e.message||'Não foi possível receber os retornos.');}
    };
    $('#importPqqReturn').onclick=async()=>{
      const file=$('#pqqReturnFile').files[0];if(!file){toast('Selecione o arquivo JSON de retorno do PQQ.');return;}
      try{const data=JSON.parse(await file.text());const r=await api('POST','/api/integracoes/pqq/retornos',data);
        toast(`Retorno processado: ${r.importados} de ${r.total_no_lote} projeto(s).`);await carregar();viewIntegracoes();
      }catch(e){toast(e.message||'Arquivo inválido ou retorno não processado.');}
    };
    $('#exportPmpQueue').onclick=async()=>{const fila=await api('GET','/api/integracoes/pmp/fila?pdf=1');baixarBlob(new Blob([JSON.stringify({schema_version:'2.0',tipo:'originacao_para_pmp',gerado_em:nowIso(),projetos:fila.map(p=>({
      id_mestre:p.id,nome:p.nome,unidade:p.unidade,area:p.diretoria,escopo_aprovado:(p.tap||{}).proposta?.escopo,
      cronograma_aprovado:(p.tap||{}).proposta?.cronograma,orcamento_total_aprovado:((p.pqq||{}).retorno||{}).orcamento_total,
      curva_mensal_aprovada:((p.pqq||{}).retorno||{}).curva_mensal,plano_id:((p.pqq||{}).retorno||{}).pqq_id,
      plano_aprovado_por:((p.pqq||{}).retorno||{}).aprovado_por,plano_aprovado_em:((p.pqq||{}).retorno||{}).aprovado_em,
      tap_aprovado_por:(p.pmp||{}).aprovado_por,tap_aprovado_em:(p.pmp||{}).aprovado_em,
      event_id:(p.pmp||{}).event_id,idempotency_key:(p.pmp||{}).idempotency_key,
      tap_documento_id:(p.pmp||{}).tap_documento_id,tap_pdf:(p.pmp||{}).tap_pdf
    }))},null,2)],{type:'application/json'}),'fila-pmp-'+new Date().toISOString().slice(0,10)+'.json');};
  }catch(e){m.innerHTML=`<h1>Integração PQQ / PMP</h1><div class="note bad">Não foi possível carregar as filas: ${esc(e.message)}</div>`;}
}

/* ============ Usuários e perfis (PMO) ============ */
async function viewUsuarios(){
  const m=$('#main');
  if(!isPMO(USER)){m.innerHTML='<h1>Usuários</h1><div class="note">Área restrita ao PMO.</div>';return;}
  const us=await api('GET','/api/usuarios');USERS=us;
  const hub=!!(META&&META.modo==='hub');
  const linhas=us.map(u=>`<tr><td>${esc(u.nome)}${u.origem==='demo'?' <span class="muted">(demo)</span>':''}</td><td>${esc(u.email||'')}</td>
    <td><select data-perf="${esc(u.id)}">${Object.entries(PERFIL).map(([k,l])=>`<option value="${k}"${k===u.perfil?' selected':''}>${esc(l)}</option>`).join('')}</select></td>
    <td><select data-uni="${esc(u.id)}"><option value="">Todas</option>${UNIDADES.map(x=>`<option${x===u.unidade?' selected':''}>${esc(x)}</option>`).join('')}</select></td>
    <td><button class="btn" data-salvaru="${esc(u.id)}">Salvar</button></td></tr>`).join('');
  m.innerHTML=`<h1>Usuários e perfis</h1><p class="lede">${hub?'O hub informa <b>quem</b> é cada pessoa (login único). Aqui o PMO define <b>o que</b> ela faz nesta ferramenta: perfil e unidade. Quem entra pela primeira vez recebe o perfil Solicitante (administradores do hub entram como PMO).':'Modo isolado: usuários de demonstração, um por perfil.'}</p>
    <div class="tablewrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Unidade</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>`;
  m.querySelectorAll('[data-salvaru]').forEach(b=>b.onclick=async()=>{const id=b.dataset.salvaru;
    try{await api('PUT','/api/usuarios/'+encodeURIComponent(id),{perfil:m.querySelector(`[data-perf="${CSS.escape(id)}"]`).value,unidade:m.querySelector(`[data-uni="${CSS.escape(id)}"]`).value||null});toast('Perfil atualizado.');
      if(SESSAO&&SESSAO.real&&SESSAO.real.id===id){await carregarSessao();}viewUsuarios();}catch(e){toast(e.message);}});
}

/* ============ Exemplo ============ */
async function gerarExemplo(){
  const y=new Date().getFullYear();
  const iso=d=>d.toISOString().slice(0,10);
  const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const hoje=new Date();
  const c1={id:'c-'+(y+1),nome:`${V('plano_sigla')} ${y+1}–${y+5}`,abertura:iso(add(hoje,-75)),corte:iso(add(hoje,45)),inicio:y+1,fim:y+5};
  const c2={id:'c-'+(y+2),nome:`${V('plano_sigla')} ${y+2}–${y+6}`,abertura:iso(add(hoje,290)),corte:iso(add(hoje,410)),inicio:y+2,fim:y+6};
  await writeDoc('ciclos',c1);await writeDoc('ciclos',c2);
  const unis=UNIDADES.slice(0,4);while(unis.length<4)unis.push(unis[unis.length-1]||'Unidade A');
  const dem=USERS.filter(u=>u.origem==='demo');
  const nomeDe=(perfil,un)=>((dem.find(u=>u.perfil===perfil&&(!un||u.unidade===un))||dem.find(u=>u.perfil===perfil)||{nome:'Usuário de demonstração'}).nome);
  const pessoas=Object.fromEntries(unis.map(un=>{const u=dem.find(x=>x.perfil==='solicitante'&&x.unidade===un)||dem.find(x=>x.perfil==='solicitante')||{nome:'Solicitante',id:'u-demo-solic1'};return [un,[u.nome,u.id]];}));
  const aprov={FSE:nomeDe('validador'),FSP:nomeDe('validador'),ELEG:nomeDe('pmo')};
  const ar=k=>DIRETORIAS.includes(k)?k:(DIRETORIAS[0]||k);
  const [A,B,C,D]=unis;
  const L=[
   ['Modernização do sistema de controle operacional',A,ar('Tecnologia'),'MADURO','aprovado',182000,c1],
   ['Substituição de equipamentos de climatização',A,ar('Manutenção'),'FSP','em_validacao',46500,c1],
   ['Reforma da oficina de manutenção',A,ar('Engenharia'),'BC','rascunho',38000,c1],
   ['Retrofit da frota de veículos de apoio',B,ar('Engenharia'),'FSP','rascunho',265000,c1],
   ['Nova subestação de energia',B,ar('Engenharia'),'ELEG','em_validacao',74000,c1],
   ['Videomonitoramento analítico nas instalações',B,ar('Tecnologia'),'FSE','em_validacao',12000,c1],
   ['Acessibilidade plena nos pontos de atendimento',B,ar('Engenharia'),'BC','devolvido',58000,c1],
   ['Ampliação do pátio de estacionamento',C,ar('Engenharia'),'FSP','rascunho',120000,c2],
   ['Automação do controle de acesso',C,ar('Tecnologia'),'FSE','rascunho',95000,c2],
   ['Troca de cabos de média tensão',C,ar('Manutenção'),'MADURO','aprovado',33000,c1],
   ['Recuperação emergencial de talude',D,ar('Engenharia'),'ELEG','rascunho',21000,c1],
   ['Implantação de sistema de gestão da manutenção',D,ar('Tecnologia'),'FSE','rascunho',140000,c2],
   ['Revitalização de ativos operacionais',D,ar('Manutenção'),'BC','em_validacao',67000,c2],
   ['Pagamentos digitais no atendimento',A,ar('Tecnologia'),'FSP','rascunho',18500,c1]
  ];
  let n=maxLocalId();
  for(const [nome,un,dir,est,st,cap,cic] of L){
    n++;const id=await proximoId();
    const [resp,sid]=pessoas[un];const idx=IDX[est];
    const criado=add(hoje,-(60+idx*55+Math.floor(Math.random()*40)));
    const gates={};GATES.forEach((g,i)=>{
      if(i<idx)gates[g]={status:'aprovado',enviadoPor:resp,enviadoEm:add(criado,i*50+20).toISOString(),decididoPor:g==='BC'?nomeDe('gestor',un):aprov[g],decididoEm:add(criado,i*50+30).toISOString(),comentario:''};
      else if(i===idx)gates[g]=st==='em_validacao'?{status:'em_validacao',enviadoPor:resp,enviadoEm:add(hoje,-4).toISOString()}:st==='devolvido'?{status:'devolvido',enviadoPor:resp,enviadoEm:add(hoje,-12).toISOString(),decididoPor:nomeDe('gestor',un),decididoEm:add(hoje,-6).toISOString(),comentario:'Detalhar alternativas avaliadas e o ganho esperado em disponibilidade.'}:{status:'rascunho'};
      else gates[g]={status:'rascunho'};
    });
    const capexAno={};
    if(idx>=1){const pesos=[.12,.26,.3,.2,.12];pesos.forEach((w,i)=>capexAno[cic.inicio+i]=Math.round(cap*w));}
    const validacoes=[];
    GATES.forEach(g=>{const s=gates[g];if(s.enviadoEm)validacoes.push({em:s.enviadoEm,por:s.enviadoPor,perfil:'Solicitante',gate:g,acao:'Enviado para validação',comentario:''});if(s.decididoEm)validacoes.push({em:s.decididoEm,por:s.decididoPor,perfil:g==='BC'?'Gestor da unidade':g==='ELEG'?'Administrador PMO':'Validador técnico',gate:g,acao:s.status==='aprovado'?'Aprovado':'Devolvido para ajuste',comentario:s.comentario||''});});
    validacoes.sort((a,b)=>a.em.localeCompare(b.em));
    const p={id,pep:idx>=3?'P-'+un.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()+'-'+(24000+n):'',nome,descricao:`Demanda da ${un} para ${nome.toLowerCase()}.`,unidade:un,diretoria:dir,responsavel:resp,solicitante:resp,solicitanteId:sid,
      estagio:est,status:'Ativo',cicloId:cic.id,capexEstimado:Math.round(cap*0.9),capexAno,
      fse:{area:un+' · '+dir,urgencia:nome.includes('emergencial')?'Crítica':'Média',problema:`Necessidade identificada pela ${dir.toLowerCase()} da ${un}: ${nome.toLowerCase()}.`,justificativa:'Impacto em disponibilidade operacional e atendimento contratual.',estimativa:'Ordem de grandeza por benchmark interno'},
      bc:idx>=1?{objetivo:'Garantir confiabilidade e conformidade contratual.',escopo:'Escopo preliminar com fornecimento, instalação e comissionamento.',alternativas:'Manter e reparar; substituir parcialmente; substituir integralmente.',beneficios:'Redução de falhas e de custo de manutenção corretiva.',capexInicial:Math.round(cap*0.95),riscos:'Prazo de fornecimento e janelas operacionais.',prazo:'24 meses'}:{},
      fsp:idx>=2&&!(est==='FSP'&&st==='rascunho'&&nome.includes('Retrofit'))?{escopo:'Escopo consolidado após estudos de engenharia.',cronograma:'Contratação em 6 meses; execução em 18 meses.',premissas:'Janelas noturnas; sem interrupção comercial.',riscos:'Interfaces com sistemas existentes.',docTecnica:'Estudo de viabilidade técnica rev. A'}:{},
      gates,caminho:nome.includes('emergencial')?'extraordinario':'regular',
      extra:nome.includes('emergencial')?{status:'solicitado',motivo:'Instabilidade identificada em inspeção de rotina.',justificativa:'Risco à operação antes do próximo ciclo orçamentário.',urgencia:'Crítica',capex:21000,solicitadoPor:resp}:null,
      maturidadeManual:'',documentos:[{id:'d'+n,tipo:'FSE',nome:'FSE assinada',url:'https://example.com/fse-'+n+'.pdf',por:resp,em:criado.toISOString()}],
      validacoes,hist:[{em:criado.toISOString(),por:resp,perfil:'Solicitante',acao:'Projeto criado',campo:'',de:'',para:nome}],
      criadoEm:criado.toISOString(),atualizadoEm:add(hoje,-2).toISOString()};
    if(st==='em_validacao'&&est==='ELEG'&&!p.cicloId)p.cicloId=c1.id;
    await writeDoc('projetos',p);
  }
}

/* ============ Inicialização ============ */
$('#userSel').onchange=async e=>{const id=e.target.value;USER=(SESSAO&&SESSAO.real&&SESSAO.real.id===id)?SESSAO.real:(USERS.find(u=>u.id===id)||USER);S.editing=false;try{localStorage.setItem(UKEY,USER.id);}catch(x){}if(META&&META.modo==='hub'){try{await carregarSessao();}catch(x){}}render();};
window.addEventListener('hashchange',()=>{if(S.editing&&!confirm('Há alterações não salvas. Sair mesmo assim?')){return;}S.editing=false;render();window.scrollTo(0,0);});
async function boot(){
  try{aplicarMeta(await api('GET','/api/meta'));}catch(e){}
  ativarRotulos();
  try{USERS=await api('GET','/api/usuarios');}catch(e){}
  if(META&&META.modo==='hub'){
    try{localStorage.removeItem(UKEY);}catch(e){}
    try{await carregarSessao();}catch(e){$('#main').innerHTML=`<h1>Acesso pelo hub</h1><p class="lede">${esc(e.message)}</p>`;return;}
  }else carregarUsuarioSalvo();
  try{await carregar();S.mode='servidor';render();}
  catch(e){$('#main').innerHTML=`<h1>Servidor indisponível</h1><p class="lede">Não foi possível ler a base local (${esc(e.message)}). Verifique se o servidor está rodando e recarregue a página.</p>`;return;}
  setInterval(verificarAtualizacoes,4000);
  window.addEventListener('strathub:notificacoes',e=>{S.notif=e.detail.pendentes;renderShell(((location.hash||'#/torre').slice(2).split('/')[0])||'torre');});
  if(META&&META.modo==="hub"){sincronizarAgora(false);setInterval(()=>sincronizarAgora(),30000);}
}
boot();
</script>
